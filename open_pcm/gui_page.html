<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPEN-PCM</title>
<style>
:root { --ink:#1b241c; --muted:#5b655c; --line:#d4dbd4; --bg:#f6f7f4; --card:#fff; --accent:#1f6b4a; --warn:#8a2f1a; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.45 "Source Sans 3", "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
header { padding:20px 28px 8px; }
h1 { margin:0; font-size:22px; font-weight:650; }
.sub { color:var(--muted); margin-top:4px; }
main { padding:8px 28px 40px; max-width:1100px; }
form { display:flex; flex-wrap:wrap; gap:12px 16px; align-items:end; background:var(--card); border:1px solid var(--line); padding:16px 18px; margin:16px 0; }
label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
input, select { font:15px/1.3 inherit; color:var(--ink); border:1px solid var(--line); padding:6px 8px; min-width:8rem; background:#fff; }
button { background:var(--accent); color:#fff; border:0; padding:8px 18px; font:600 15px inherit; cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
#status { min-height:1.4em; color:var(--muted); }
#status.err { color:var(--warn); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:12px 0 20px; }
.tile { background:var(--card); border:1px solid var(--line); padding:12px 14px; }
.tile b { display:block; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.tile span { font-size:20px; font-variant-numeric:tabular-nums; }
#chart { width:100%; height:280px; background:var(--card); border:1px solid var(--line); }
table { width:100%; border-collapse:collapse; background:var(--card); margin-top:8px; }
th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
caption { text-align:left; font-weight:650; padding:8px 0; }
.pick { flex-direction:row; align-items:center; gap:8px; margin-bottom:8px; }
</style>
</head>
<body>
<header>
  <h1>OPEN-PCM</h1>
  <p class="sub">Local dispatch viewer. Loads a packaged example, solves it on this machine, and draws the hourly prices.</p>
</header>
<main>
  <form id="form">
    <label>Example
      <select id="case" name="case" required></select>
    </label>
    <label>Year
      <input id="year" name="year" type="number" value="2027" step="1" required>
    </label>
    <label>First hour
      <input id="start" name="start" type="number" value="0" min="0" max="8759" required>
    </label>
    <label>Last hour
      <input id="end" name="end" type="number" value="167" min="0" max="8759" required>
    </label>
    <label>Mode
      <select id="mode" name="mode"></select>
    </label>
    <button id="run" type="submit">Run</button>
  </form>
  <p id="status">Choose an example and press Run. The first week of the year is the default horizon.</p>
  <section id="results" hidden>
    <div class="grid" id="tiles"></div>
    <label class="pick">Price shown
      <select id="series"></select>
    </label>
    <svg id="chart" viewBox="0 0 1000 280" role="img" aria-label="Hourly price"></svg>
    <table id="gen">
      <caption>Generation by unit</caption>
      <thead><tr><th>Unit</th><th>Node</th><th>Type</th><th>MWh</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n, d=1) => n==null ? '—' : Number(n).toLocaleString(undefined, {maximumFractionDigits:d});

async function boot() {
  const r = await fetch('/api/examples');
  const j = await r.json();
  for (const name of j.examples) {
    const o = document.createElement('option'); o.value = name; o.textContent = name; $('case').appendChild(o);
  }
  for (const mode of j.modes) {
    const o = document.createElement('option'); o.value = mode; o.textContent = mode; $('mode').appendChild(o);
  }
}

function tile(label, value) {
  const d = document.createElement('div'); d.className = 'tile';
  d.innerHTML = '<b></b><span></span>';
  d.firstChild.textContent = label;
  d.lastChild.textContent = value;
  return d;
}

function drawChart(hour, values, label) {
  const svg = $('chart');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const W=1000, H=280, p={l:52,r:16,t:16,b:32};
  const iw=W-p.l-p.r, ih=H-p.t-p.b;
  const lo=Math.min(...values), hi=Math.max(...values);
  const ymin=Math.min(0, lo*1.05), ymax=Math.max(1, hi*1.05);
  const x = (i) => p.l + (hour.length<=1 ? iw/2 : iw*i/(hour.length-1));
  const y = (v) => p.t + ih*(1 - (v-ymin)/(ymax-ymin));
  const ns = 'http://www.w3.org/2000/svg';
  const el = (name, attrs, text) => {
    const n = document.createElementNS(ns, name);
    for (const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
    if (text!=null) n.textContent = text;
    svg.appendChild(n); return n;
  };
  el('rect', {x:0,y:0,width:W,height:H,fill:'#fff'});
  for (let t=0;t<=4;t++) {
    const v = ymin + (ymax-ymin)*t/4, yy=y(v);
    el('line', {x1:p.l,y1:yy,x2:W-p.r,y2:yy,stroke:'#e3e8e3'});
    el('text', {x:p.l-8,y:yy+4,'text-anchor':'end',fill:'#5b655c','font-size':'11'}, fmt(v,0));
  }
  const pts = values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  el('polyline', {fill:'none',stroke:'#1f6b4a','stroke-width':'2',points:pts});
  el('text', {x:p.l,y:H-8,fill:'#5b655c','font-size':'11'}, 'Hour ' + hour[0] + '–' + hour[hour.length-1] + '  ·  ' + label + ', $/MWh');
}

let last = null;

function redraw() {
  if (!last) return;
  const k = $('series').value;
  if (k) drawChart(last.chart.hour, last.chart.series[k], 'price at ' + ($('series').selectedOptions[0].textContent));
  else drawChart(last.chart.hour, last.chart.mean_price_usd_mwh, 'mean price');
}

function show(j) {
  $('results').hidden = false;
  const tiles = $('tiles'); tiles.innerHTML = '';
  tiles.append(
    tile('Status', j.status + (j.flagged ? ' (flagged)' : '')),
    tile('Mode', j.mode),
    tile('Hours', String(j.hours)),
    tile('Load, MWh', fmt(j.load_MWh,1)),
    tile('Generation, MWh', fmt(j.generation_MWh,1)),
    tile('Unserved, MWh', fmt(j.unserved_MWh,2)),
    tile('Mean price, $/MWh', fmt(j.price_mean_usd_mwh,2)),
    tile('Price range, $/MWh', fmt(j.price_min_usd_mwh,2) + ' – ' + fmt(j.price_max_usd_mwh,2)),
  );
  const pick = $('series'); pick.innerHTML = '';
  const area = j.mode === 'zonal' ? 'zone' : 'node';
  const mean = document.createElement('option'); mean.value = ''; mean.textContent = 'Mean of all ' + area + 's'; pick.appendChild(mean);
  const keys = Object.keys(j.chart.series).sort((a, b) => a.localeCompare(b, undefined, {numeric:true}));
  for (const k of keys) {
    const o = document.createElement('option'); o.value = k; o.textContent = area + ' ' + k; pick.appendChild(o);
  }
  last = j;
  redraw();
  const tb = $('gen').querySelector('tbody');
  tb.innerHTML = '';
  for (const r of j.generation) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td></td>';
    tr.children[0].textContent = r.name;
    tr.children[1].textContent = r.zone ? (r.node + ' / ' + r.zone) : r.node;
    tr.children[2].textContent = r.type;
    tr.children[3].textContent = fmt(r.MWh, 1);
    tb.appendChild(tr);
  }
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('run'); btn.disabled = true;
  $('status').className = '';
  $('status').textContent = 'Solving…';
  const body = {
    case: $('case').value,
    year: Number($('year').value),
    start: Number($('start').value),
    end: Number($('end').value),
    mode: $('mode').value,
  };
  try {
    const r = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'request failed');
    $('status').textContent = j.case + '  ·  ' + j.year + '  ·  hours ' + j.start + '–' + j.end;
    show(j);
  } catch (err) {
    $('status').className = 'err';
    $('status').textContent = err.message || String(err);
  } finally {
    btn.disabled = false;
  }
});

$('series').addEventListener('change', redraw);

boot();
</script>
</body>
</html>
