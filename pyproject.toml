[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "open-pcm"
version = "0.3.0"
description = "Hourly production cost model with nodal, zonal and zonal-nodal solves"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Transition Economics Institute"}]
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "highspy>=1.5"]
[project.optional-dependencies]
test = ["pytest"]
hipo = ["highspy-extras"]
[project.scripts]
open-pcm = "open_pcm.__main__:main"
[tool.setuptools]
packages = ["open_pcm"]
